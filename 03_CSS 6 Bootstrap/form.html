<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <form action="\server">
            <div class="md-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" name="mail" id="email" class="form-control">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label">Password</label>
                <input type="password" name="Password" id="pass" class="form-control">
            </div>
            
            <select name="opt" class="form-select">
                <option selected>Choose Goat</option>
                <option value="1">Cristiano Ronaldo</option>
                <option value="2">Leonel Messi</option>
                <option value="3">Neymar Jr.</option>
                <option value="4">Zinedine Zidan</option>
            </select>
            <div class="mt-3">
                <input type="checkbox" name="agreebs" id="agree" class="form-check-input">
                <label for="agree" class="form-check-label">I'm Agree</label>
            </div>
            
            <div class="mt-3">
                <input type="radio" name="radiobs" id="radio" class="form-check-input">
                <label for="radio" class="form-check-label">18+</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
